# MMRotate dev container for an x86_64 NVIDIA host (driver >= 580).
#   docker compose -f docker/docker-compose.yaml build
#   docker compose -f docker/docker-compose.yaml run --rm mmrotate-dev
# Override the data mount with DATA_ROOT=/path/to/data.
services:
  mmrotate-dev:
    image: mmrotate-dev:latest
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /mmrotate
    volumes:
      - ..:/mmrotate
      - ${DATA_ROOT:-/mnt}:/mnt
      - ~/.vscode-server:/root/.vscode-server
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: 16g
    ipc: host
    network_mode: host
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
