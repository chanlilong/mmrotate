# Phase 1 / ViT-CoMer: frozen DINOv3 ViT-S/16 + trainable ViT-CoMer-S adapter
# (CNN spatial prior branch + CNN<->ViT interaction), P2-P5 outputs.
_base_: ./_base_/rtmdet-p2_dinov3_6e.yaml

model:
  backbone:
    _delete_: true
    type: TimmViTCoMer
    model_name: vit_small_patch16_dinov3
    checkpoint: /mnt/4TB/weights/timm/vit_small_patch16_dinov3.lvd1689m
    freeze_vit: true
    interaction_indexes: [[0, 2], [3, 5], [6, 8], [9, 11]]
    conv_inplane: 64
    n_points: 4
    deform_num_heads: 6
    deform_ratio: 1.0
    cffn_ratio: 0.25
    init_values: 0.0
    use_extra_CTI: true
    extra_num: 4
    cnn_feature_interaction: true
    add_vit_feature: true
    drop_path_rate: 0.1
    # Gradient checkpointing keeps batch 8 at 800x800 within 24 GB.
    with_cp: true
    vit_with_cp: true
    norm_cfg: {type: BN, requires_grad: true}
    out_indices: [0, 1, 2, 3]  # strides 4 / 8 / 16 / 32
  neck:
    in_channels: [384, 384, 384, 384]
