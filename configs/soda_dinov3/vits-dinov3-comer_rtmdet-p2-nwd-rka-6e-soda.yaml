# Phase 2 / NWD-RKA on the phase-1 ViT winner (ViT-CoMer). Ranking assignment:
# every GT takes its top-k priors by NWD (point priors as 4x-stride boxes), and
# NWD between the decoded box and its GT is the soft classification target.
# C = 16.6 is the mean sqrt(w*h) of the SODA-A train patches
# (tools/analysis_tools/nwd_constant.py).
_base_: ./vits-dinov3-comer_rtmdet-p2-6e-soda.yaml

model:
  train_cfg:
    assigner:
      _delete_: true
      type: RankingAssigner
      topk: 9
      neg_thr: 0.3
      point_prior_scale: 4.0
      iou_calculator: &nwd {type: RBboxNWD2D, constant: 16.6}
      quality_calculator: *nwd
