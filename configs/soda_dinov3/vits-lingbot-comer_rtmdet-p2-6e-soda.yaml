# ViT-CoMer on LingBot-Vision ViT-S/16: frozen LingBot ViT-S (cls + 4 storage
# tokens, RoPE) + trainable ViT-CoMer-S adapter, P2-P5 outputs. Same adapter
# settings as vits-dinov3-comer_rtmdet-p2-6e-soda.yaml; only the ViT differs.
_base_: ./_base_/rtmdet-p2_dinov3_6e.yaml

model:
  backbone:
    _delete_: true
    type: LingBotViTCoMer
    arch: vit_small
    # HF snapshot of robbyant/lingbot-vision-vit-small (model.pt), loaded strictly.
    checkpoint: /mnt/zfs/models/robbyant/lingbot-vision-vit-small
    freeze_vit: true
    interaction_indexes: [[0, 2], [3, 5], [6, 8], [9, 11]]
    conv_inplane: 64
    n_points: 4
    deform_num_heads: 6
    deform_ratio: 1.0
    cffn_ratio: 0.25
    init_values: 0.0
    use_extra_CTI: true
    extra_num: 4
    cnn_feature_interaction: true
    add_vit_feature: true
    drop_path_rate: 0.1
    with_cp: true
    vit_with_cp: true
    norm_cfg: {type: BN, requires_grad: true}
    out_indices: [0, 1, 2, 3]  # strides 4 / 8 / 16 / 32
  neck:
    in_channels: [384, 384, 384, 384]
