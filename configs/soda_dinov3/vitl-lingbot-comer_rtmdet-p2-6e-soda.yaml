# ViT-CoMer on LingBot-Vision ViT-L/16: frozen LingBot ViT-L (24 blocks, 1024-d)
# + trainable ViT-CoMer-L adapter (4 stages of 6 blocks, 16 deformable heads,
# deform_ratio 0.5 as in ViT-CoMer-L), P2-P5 outputs. Data, schedule and
# optimiser are the shared SODA-A settings, so runs compare with ViT-S.
_base_: ./_base_/rtmdet-p2_dinov3_6e.yaml

model:
  backbone:
    _delete_: true
    type: LingBotViTCoMer
    arch: vit_large
    # HF snapshot of robbyant/lingbot-vision-vit-large (model.pt), loaded strictly.
    checkpoint: /mnt/zfs/models/robbyant/lingbot-vision-vit-large
    freeze_vit: true
    interaction_indexes: [[0, 5], [6, 11], [12, 17], [18, 23]]
    conv_inplane: 64
    n_points: 4
    deform_num_heads: 16
    deform_ratio: 0.5
    cffn_ratio: 0.25
    init_values: 0.0
    use_extra_CTI: true
    extra_num: 4
    cnn_feature_interaction: true
    add_vit_feature: true
    drop_path_rate: 0.1
    with_cp: true
    vit_with_cp: true
    norm_cfg: {type: BN, requires_grad: true}
    out_indices: [0, 1, 2, 3]  # strides 4 / 8 / 16 / 32
  neck:
    in_channels: [1024, 1024, 1024, 1024]
