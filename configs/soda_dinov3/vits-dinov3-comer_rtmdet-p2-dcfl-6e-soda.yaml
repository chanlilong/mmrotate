# DCFL (Xu et al., CVPR 2023) on the ViT-CoMer SODA-A model: DCN dynamic priors
# (RotatedRTMDetSepBNDCFLHead) + coarse-to-fine assignment (C2FAssigner).
# - Point priors are ranked as 4x-stride boxes, i.e. 16 px at P2, about the
#   SODA-A mean sqrt(w*h) of 16.6 px. Coarse top-16 by GJSD, fine top-12 by
#   IoU(pred, gt) + score, then the DGMM constraint (exp(-0.6)).
# - The QFL soft target / box-loss weight stays the rotated IoU of the prediction
#   (see the NWD-RKA config for why a Gaussian-metric quality is unsafe with
#   exp_on_reg off).
# - topk / topq / gauss_thr are the paper's DOTA values and worth sweeping here:
#   SODA-A patches hold many more, smaller GTs per image.
_base_: ./vits-dinov3-comer_rtmdet-p2-6e-soda.yaml

model:
  bbox_head:
    type: RotatedRTMDetSepBNDCFLHead
    dilation_rate: 3
    prior_offset_scale: 0.5
  train_cfg:
    assigner:
      _delete_: true
      type: C2FAssigner
      topk: 16
      topq: 12
      neg_thr: 0.8
      constraint: dgmm
      gauss_thr: 0.6
      point_prior_scale: 4.0
      iou_calculator: {type: RBboxGJSD2D}
      quality_calculator: {type: RBboxOverlaps2D}
