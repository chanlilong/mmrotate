# Rotated RTMDet (CSPNeXtPAFPN + RotatedRTMDetSepBNHead, RTMDet losses) on a
# frozen NVIDIA C-RADIOv4-H ViT wrapped by the ViT-CoMer adapter.
# Mirrors configs/rotated_rtmdet/rotated_rtmdet_l-3x-dota_ms.py.
# Weights are read directly from the HuggingFace download (no conversion).
_base_:
  - ../rotated_rtmdet/_base_/default_runtime.py
  - ../rotated_rtmdet/_base_/schedule_3x.py
  - ../rotated_rtmdet/_base_/dota_rr_ms.py

model:
  type: mmdet.RTMDet
  data_preprocessor:
    type: mmdet.DetDataPreprocessor
    # RADIO's CLIP normalisation, expressed in 0-255 RGB.
    mean: [122.771, 116.746, 104.094]
    std: [68.501, 66.632, 70.323]
    bgr_to_rgb: true
    pad_size_divisor: 32
    boxtype2tensor: false
    batch_augments: null
  backbone:
    type: CRADIOv4CoMer
    checkpoint: /mnt/zfs/models/nvidia/C-RADIOv4-H
    freeze_vit: true
    vit_with_cp: true
    interaction_indexes: [[0, 7], [8, 15], [16, 23], [24, 31]]
    conv_inplane: 64
    n_points: 4
    deform_num_heads: 16
    deform_ratio: 0.5
    cffn_ratio: 0.25
    init_values: 0.0
    use_extra_CTI: true
    extra_num: 4
    cnn_feature_interaction: true
    add_vit_feature: true
    drop_path_rate: 0.1
    with_cp: true
    norm_cfg: {type: SyncBN, requires_grad: true}
    out_indices: [1, 2, 3]  # strides 8 / 16 / 32
  neck:
    type: mmdet.CSPNeXtPAFPN
    in_channels: [1280, 1280, 1280]
    out_channels: 256
    num_csp_blocks: 3
    expand_ratio: 0.5
    norm_cfg: {type: SyncBN}
    act_cfg: {type: SiLU}
  bbox_head:
    type: RotatedRTMDetSepBNHead
    num_classes: 15
    in_channels: 256
    stacked_convs: 2
    feat_channels: 256
    angle_version: le90
    anchor_generator: {type: mmdet.MlvlPointGenerator, offset: 0, strides: [8, 16, 32]}
    bbox_coder: {type: DistanceAnglePointCoder, angle_version: le90}
    loss_cls: {type: mmdet.QualityFocalLoss, use_sigmoid: true, beta: 2.0, loss_weight: 1.0}
    loss_bbox: {type: RotatedIoULoss, mode: linear, loss_weight: 2.0}
    with_objectness: false
    exp_on_reg: true
    share_conv: true
    pred_kernel_size: 1
    use_hbbox_loss: false
    scale_angle: false
    loss_angle: null
    norm_cfg: {type: SyncBN}
    act_cfg: {type: SiLU}
  train_cfg:
    assigner:
      type: mmdet.DynamicSoftLabelAssigner
      iou_calculator: {type: RBboxOverlaps2D}
      topk: 13
    allowed_border: -1
    pos_weight: -1
    debug: false
  test_cfg:
    nms_pre: 2000
    min_bbox_size: 0
    score_thr: 0.05
    nms: {type: nms_rotated, iou_threshold: 0.1}
    max_per_img: 2000

# batch_size = (N GPUs) x (2 samples per GPU)
train_dataloader:
  batch_size: 2
  num_workers: 4

# bf16 mixed precision: ~3x faster than fp32 for the ViT-H + CoMer backbone.
optim_wrapper:
  type: AmpOptimWrapper
  dtype: bfloat16
