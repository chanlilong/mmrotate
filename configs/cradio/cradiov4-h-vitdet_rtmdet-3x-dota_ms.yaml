# Rotated RTMDet on NVIDIA C-RADIOv4-H with the ViTDet design (Li et al., 2022):
# the last ViT block (stride 16) feeds a simple feature pyramid (deconv /
# identity / maxpool + 1x1 and 3x3 conv with LN, no top-down fusion), and the
# ViT is fine-tuned end to end with layer-wise lr decay. RADIO keeps global
# attention in every block. Data, head, schedule and bf16 AMP are shared with
# cradiov4-h-comer_rtmdet-3x-dota_ms.yaml.
_base_: ./cradiov4-h-comer_rtmdet-3x-dota_ms.yaml

model:
  backbone:
    _delete_: true
    type: CRADIOv4
    checkpoint: /mnt/zfs/models/nvidia/C-RADIOv4-H
    frozen: false
    out_indices: [31]
    out_strides: [16]
    vit_cfg: {drop_path_rate: 0.4, with_cp: true}
  neck:
    _delete_: true
    type: ViTDetSimpleFPN
    in_channels: 1280
    out_channels: 256
    in_stride: 16
    out_strides: [8, 16, 32]
    norm_cfg: {type: LN2d}

# ViTDet recipe: AdamW, lr 1e-4 at batch size 64, weight decay 0.1 and
# layer-wise lr decay 0.9 for ViT-H. Scale lr with the actual batch size.
optim_wrapper:
  constructor: CRADIOv4LayerDecayOptimWrapperConstructor
  optimizer: {type: AdamW, lr: 1.0e-4, betas: [0.9, 0.999], weight_decay: 0.1}
  paramwise_cfg:
    _delete_: true
    num_layers: 32
    layer_decay_rate: 0.9
