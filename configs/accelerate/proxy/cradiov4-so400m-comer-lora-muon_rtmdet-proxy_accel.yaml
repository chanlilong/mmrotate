# MuonAdamW version of cradiov4-so400m-comer-lora_rtmdet-proxy_accel.yaml (same
# optimizer block as configs/muon/cradiov4-so400m-comer-lora-muon_rtmdet-p2-3x-dota_ms.yaml).
_base_: ./cradiov4-so400m-comer-lora_rtmdet-proxy_accel.yaml

custom_imports:
  imports: [mmrotate.engine.optimizers, mmrotate.accelerate]
  allow_failed_imports: false

model:
  backbone:
    lora_cfg: {r: 16, alpha: 32}

optim_wrapper:
  constructor: MuonAdamWOptimWrapperConstructor
  optimizer:
    type: MuonAdamW
    betas: [0.9, 0.999]
    muon_momentum: 0.95
    nesterov: true
    ns_steps: 5
    adjust_lr_fn: match_rms_adamw
  paramwise_cfg:
    muon_include_keys: [lora_A, lora_B]
    muon_exclude_keys: [rtm_cls, rtm_reg, rtm_ang]
    muon_min_dim: 16
