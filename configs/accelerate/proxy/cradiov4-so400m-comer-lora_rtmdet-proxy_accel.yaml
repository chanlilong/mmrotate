# Smoke test of the accelerate configs on synthetic DOTA-style data (bf16 DDP);
# switch the recipe from the command line, e.g.
#   python tools/data/dota/make_proxy_dota.py --out data/proxy_dota
#   accelerate launch --num_processes 2 tools/accelerate/train.py <this config> \
#       --cfg-options accelerator.deepspeed.zero_optimization.stage=2
_base_: ../../cradio/cradiov4-so400m-comer-lora_rtmdet-proxy.yaml

runner_type: mmrotate.AccelerateRunner
custom_imports:
  imports: [mmrotate.accelerate]
  allow_failed_imports: false

accelerator:
  mixed_precision: bf16
  eval: {bridge: parquet, timeout_minutes: 30}

train_cfg:
  max_epochs: 4
  val_interval: 2
param_scheduler:
  - {type: LinearLR, start_factor: 1.0e-3, by_epoch: false, begin: 0, end: 20}
default_hooks:
  checkpoint: {type: CheckpointHook, interval: 2, max_keep_ckpts: 1}
