# Run on every node with its own --machine_rank (slurm: tools/accelerate/slurm_train.sbatch
# does this for you):
#   accelerate launch --config_file tools/accelerate/launch_configs/multi_node.yaml \
#       --machine_rank $NODE_RANK --main_process_ip $MAIN_NODE_IP tools/accelerate/train.py <config>
# num_processes is the total over all machines (here 2 nodes x 8 GPUs). The work_dir (and
# accelerator.eval.dir) must be on a filesystem every node can see.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
num_machines: 2
num_processes: 16
machine_rank: 0
main_process_ip: 10.0.0.1
main_process_port: 29500
gpu_ids: all
mixed_precision: 'no'
dynamo_config: {dynamo_backend: 'NO'}
rdzv_backend: static
same_network: true
use_cpu: false
