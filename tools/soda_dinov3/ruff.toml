# Lint config for the SODA-A DINOv3 experiment tools (kept local so the
# repository-wide flake8/isort/yapf setup is untouched).
target-version = "py310"
line-length = 100

[format]
quote-style = "single"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "ANN"]
# Upper-case tensor dims (B, N, C, H, W) are idiomatic here and match upstream.
ignore = ["N803", "N806", "N812"]

[lint.isort]
known-first-party = ["mmrotate"]
