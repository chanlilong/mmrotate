# Lint config for the mmrotate.accelerate package, kept local so the
# repository-wide flake8/isort/yapf setup is untouched.
target-version = "py310"
line-length = 100

[format]
quote-style = "single"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "ANN"]

[lint.isort]
known-first-party = ["mmrotate"]
