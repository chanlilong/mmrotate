# Lint config for the C-RADIOv4 / ViT-CoMer backbone package (kept local so
# the repository-wide flake8/isort/yapf setup is untouched).
target-version = "py310"
line-length = 100

[format]
quote-style = "single"
exclude = ["msda_triton_kernels.py"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "ANN"]
# Upper-case tensor dims (B, N, C, H, W) are idiomatic here and match upstream.
ignore = ["N803", "N806", "N812"]

[lint.isort]
known-first-party = ["mmrotate"]

[lint.per-file-ignores]
# Vendored verbatim from rziga/msda-triton: Triton JIT kernels, whose argument
# annotations carry semantics, so they are not re-annotated or reformatted.
"msda_triton_kernels.py" = ["ANN", "E", "W", "I", "UP", "B", "N"]
# Our atomic-free backward kernels: Triton derives argument specialisation from
# annotations, so only the tl.constexpr arguments carry a hint.
"msda_triton_bwd.py" = ["ANN001"]
"msda_triton_fused.py" = ["ANN001"]
