# Lint config for the optimizer package (kept local so the repository-wide
# flake8/isort/yapf setup is untouched). Same rules as
# mmrotate/models/backbones/cradiov4/ruff.toml.
target-version = "py310"
line-length = 100

[format]
quote-style = "single"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "ANN"]

[lint.isort]
known-first-party = ["mmrotate"]
